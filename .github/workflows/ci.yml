name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main, feat/**]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:brands
      - run: pnpm typecheck
      - run: pnpm test

  lint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  visual:
    name: visual regression (Playwright)
    runs-on: ubuntu-latest
    # Requires network for `playwright install --with-deps` (browser system libs).
    # The build VPS cannot run this; it is the networked counterpart that the
    # authored suite (packages/preview/e2e/visual.spec.ts) targets.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:brands
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
